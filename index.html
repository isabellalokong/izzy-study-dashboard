<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Izzy Study Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <div class="left-panel">
    <h2>Classes</h2>

    <div class="subject-card pink" id="bio-card">
      <h3>Biology</h3>
      <div class="progress"><div class="progress-bar" id="bio-progress"></div></div>
      <p id="bio-grade">0%</p>
    </div>

    <div class="subject-card purple" id="chem-card">
      <h3>Chemistry</h3>
      <div class="progress"><div class="progress-bar" id="chem-progress"></div></div>
      <p id="chem-grade">0%</p>
    </div>

    <div class="subject-card peach" id="alg-card">
      <h3>Algebra 2</h3>
      <div class="progress"><div class="progress-bar" id="alg-progress"></div></div>
      <p id="alg-grade">0%</p>
    </div>

    <div class="subject-card yellow" id="eng-card">
      <h3>English</h3>
      <div class="progress"><div class="progress-bar" id="eng-progress"></div></div>
      <p id="eng-grade">0%</p>
    </div>
  </div>

  <div class="right-panel">

    <div class="header">
      <h1>Izzy</h1>
      <div class="fire">
        <div class="fire-fill" id="fireFill"></div>
      </div>
    </div>

    <h2 id="weekTitle">Week 1</h2>

    <ul id="todo-list"></ul>

    <button id="addTaskBtn">+ Add Task</button>

  </div>

</div>

<script src="script.js"></script>
</body>
</html>
